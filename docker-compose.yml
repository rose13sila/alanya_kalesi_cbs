services:
  db:
    image: postgis/postgis:15-3.3
    container_name: alanya_postgis
    environment:
      POSTGRES_DB: alanya_cbs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5433:5432"
    volumes:
      - ./veritabani/init_scripts:/docker-entrypoint-initdb.d
      - postgis_data:/var/lib/postgresql/data
    restart: always

  geoserver:
    image: kartoza/geoserver:2.23.0
    container_name: alanya_geoserver
    ports:
      - "8080:8080"
    environment:
      - GEOSERVER_ADMIN_PASSWORD=geoserver
    volumes:
      - ./geoserver_veri:/opt/geoserver/data_dir
    depends_on:
      - db
    restart: always

volumes:
  postgis_data: